 tutorial:`<h2>⚒️ Affix Merchant – návod</h2>
<p><b>Cieľ:</b> kúp zbraň na <b>Trhu</b>, vylepši ju v <b>Dielni</b>, predaj so ziskom alebo ju odovzdaj zákazníkovi.</p>
<p><b>Afixy:</b> max. <b>3 prefixy (P)</b> – poškodenie, a <b>3 sufixy (S)</b> – rýchlosť, kritické zásahy, odolnosti. Tiery <span class="t5">T5</span> → <span class="t4">T4</span> → <span class="t3">T3</span> → <span class="t2">T2</span> → <span class="t1">T1</span>. <b>ilvl</b> určuje najvyšší možný tier.</p>
<p><b>⚖ Stabilita = rozpočet predmetu.</b> KAŽDÁ úprava ju míňa (cena je modrou na tlačidle vpravo hore). Na 0 je predmet <b>zapečatený</b>. Zvyšná stabilita zvyšuje predajnú cenu (nedotknutosť) a niektorí zákazníci ju vyžadujú.</p>
<p><b>Akcie:</b> 💠 pridá afix · 🎲 prehodí hodnoty (P/S len prefixy/sufixy) · 🌀 zruší náhodný · ✂️ zruší vybraný · 🔁 vymení vybraný · 🧪 pridá konkrétny afix · 🔥 Vyhňa zvýši tier (riziko prasknutia) · 🔒 zamkne afix.</p>
<p><b>♻ Rozobratie</b> dá <b>🔆 uhlíky</b> (nedajú sa kúpiť): obnovia stabilitu, treba ich na T1 kovanie a Runu zámku. Smeť a prasknuté predmety sa oplatí rozobrať – predaj dá málo.</p><p><b>Ovládanie:</b> ťukni na afix na karte → Vyhňa, Výmena, Vystrihnutie, Zámok. Spodná lišta = akcie pre celý predmet. <b>Podrž</b> tlačidlo = vysvetlenie. 🔮 Znamenie zmení ďalšiu úpravu. ✦ Legendárny potenciál = +1 miesto na afix. Živly (oheň, mráz, blesk, chaos) rozžiaria zbraň efektmi. 🎨 Zbierka = nové vzhľady zbraní.</p><p><b>📖 Kódex:</b> každý dokončený riadok (všetkých 5 tierov afixu) = trvalý bonus. <b>🌑 Korupcia:</b> riskantná jednorazová akcia – zlepšenie alebo zničenie. <b>👑 Prestíž:</b> po dosiahnutí cieľa predaj obchod a získaj trvalé Majstrovské body (Rozvoj).</p>`},

  <div class="flex"><button class="${g?'gold':''} grow" id="presBtn" data-act="presAsk" ${g?'':'disabled'}>${t('presBtn')}${g?' (+'+g+' '+t('mpS')+')':'<br><span style="font-size:11px">'+t('presLock').replace('{g}',fmtN(goal-S.life))+'</span>'}</button><button class="void grow" id="masterBtn" data-act="sheet" data-arg="master">${t('master')}</button></div></div>
  <div class="panel"><div class="flex"><b class="grow">⭐ ${t('rep')} – ${t('level')} ${S.lvl}</b><span class="muted">${S.xp}/${needXp(S.lvl)} XP</span></div><div class="bar"><i style="width:${S.xp/needXp(S.lvl)*100}%"></i></div>
  <div class="lvg">${[1,2,3,4].map(l=>`<div>${S.lvl>=l?'✅':'🔒'} ${l}: ${t('u'+l)}</div>`).join('')}</div><div class="muted">${t('uI')} (${marketMax()})</div></div>
  ${UPS.map(u=>{const l=S.up[u.k],mx=l>=u.max,rq=u.req(l);return `<div class="mrow"><div class="grow"><b>${t('up_'+u.k)}</b> (${l}/${u.max})<div class="muted">${t('up_'+u.k+'D')}${!mx&&S.lvl<rq?' · '+t('needLvl')+' '+rq:''}</div></div><button class="gold" data-act="upgrade" data-arg="${u.k}" ${mx||S.lvl<rq?'disabled':''}>${mx?t('maxed'):u.cost(l)+'🪙'}</button></div>`}).join('')}
  <button class="red sm" data-act="reset">🗑 ${t('reset')}</button>`}
};
const SH={
 shop:()=>`<div class="flex"><h2 class="grow">🛒 ${t('shopT')}</h2><span>🪙 ${S.gold} · 🔆 ${S.cur.embers}</span></div>`+CURS.map(c=>{const lk=CURLV[c]&&S.lvl<CONFIG[CURLV[c]],p=curCost(c),e=c==='lock'?CONFIG.lockEmbers:0;
  const w=lk?`🔒 ${t('unlockAt')} ${CONFIG[CURLV[c]]}`:S.gold<p?`${t('needGold')} ${p-S.gold}🪙`:S.cur.embers<e?t('noEmbers'):'';
  return `<div class="shopi"><div class="flex"><div style="font-size:24px">${CICO[c]}${CTAG[c]?`<sub style="font-size:11px">${CTAG[c]}</sub>`:''}</div><div class="grow"><b>${t(c)}</b> · ${t('owned')}: <b id="own-${c}">${S.cur[c]}</b>${CONFIG.stabCost[c]?` · <span style="color:#7fd0ff">⚖${CONFIG.stabCost[c]}</span>`:''}<div class="muted">${t(c+'D')}</div></div>
  <button class="gold" id="shop-${c}-1" data-act="buyCur" data-arg="${c}:1" ${w?'disabled':''}>×1<br>${p}🪙${e?'+'+e+'🔆':''}</button><button class="gold" id="shop-${c}-5" data-act="buyCur" data-arg="${c}:5" ${w||S.gold<p*5||S.cur.embers<e*5?'disabled':''}>×5<br>${p*5}🪙</button></div>${w?`<div class="warn" style="font-size:12px">${w}</div>`:''}</div>`}).join('')+
  `<div class="shopi"><div class="flex"><div style="font-size:24px">🔆</div><div class="grow"><b>${t('embers')}</b> · ${t('owned')}: <b>${S.cur.embers}</b><div class="muted">${t('embersD')}</div><div class="warn" style="font-size:12px">${t('srcE')}</div></div></div></div><div class="muted" style="margin:4px 0 8px">${t('src')}</div><button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`,
 master:()=>`<div class="flex"><h2 class="grow">${t('master')}</h2><b style="color:#d898ff">${S.mp} ${t('mpS')}</b></div>`+MUPS.map(u=>{const l=S.mup[u.k],mx=l>=u.max,c=l+1;return `<div class="mrow"><div class="grow"><b>${t('m_'+u.k)}</b> <span class="muted">(${l}/${u.max})</span><div class="muted">${t('m_'+u.k+'D')}</div></div><button class="${mx||S.mp<c?'':'gold'}" id="mu-${u.k}" data-act="mup" data-arg="${u.k}" ${mx||S.mp<c?'disabled':''}>${mx?t('maxed'):t('mpCost').replace('{n}',c)}</button></div>`}).join('')+`<button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`,
 skins:()=>V.collection()+`<button style="width:100%;margin-top:6px" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`,
 hof:()=>`<div class="panel"><h2>👑 ${t('hof')}</h2>${S.hof.length?S.hof.map(h=>`<div class="t1">${h.name} · ${t(h.base)} · ilvl ${h.ilvl} · ${h.at}</div>`).join(''):`<div class="muted">${t('hofE')}</div>`}</div><div class="panel"><h2>${t('stats')}</h2>${t('sold')}: ${S.stats.sold} · ${t('profit')}: ${S.stats.profit}🪙 · ${t('crafts')}: ${S.stats.crafts} · ${t('t1s')}: ${S.stats.t1} · ${t('streak')}: ${S.login.streak} · 🌑 ${S.stats.corr||0} · 👑 ${S.stats.prestiges||0} · ${t('life')}: ${fmtN(S.life)}🪙</div><button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`,
 stash:()=>`<h2>📦 ${t('stash')} ${S.items.length}/${stallSize()}</h2>${S.items.length?S.items.map((x,i)=>`<div class="si" style="--rc:${RAR[rarity(x)][1]}"><div class="ic">${wcv('i'+i,40)}</div><div class="grow" data-act="selItem" data-arg="${i}"><b style="color:var(--rc)">${nameOf(x)}</b>${x.frac?' <span class="tagx">💔</span>':''}${x.lp?' <span class="lpb">✦</span>':''}<div class="muted">ilvl ${x.ilvl} · ${x.unid?'?':all(x).length+'× afix · ⚖'+x.stab+'/'+x.stab0}</div></div>
  <button class="sm" data-act="selItem" data-arg="${i}">⚒️</button>${x.unid?'':`<button class="sm ${isJunk(x)?'':'gold'}" id="sl-${i}" data-act="sell" data-arg="${i}">${sellPrice(x)}🪙</button><button class="sm ${isJunk(x)?'gold':''}" id="sv-${i}" data-act="salvage" data-arg="${i}">♻${salvageN(x)}🔆</button>`}</div>`).join(''):`<div class="muted">${t('noItem')}</div>`}<button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`,
 essence:()=>{const it=cur();return `<h2>${t('essenceT')}</h2><div class="muted">${t('essenceD2')} · ${essCost()}🪙 · ⚖${CONFIG.stabCost.essence}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0">${it?AFF.filter(a=>it[a.s].length<sideCap(it)&&!all(it).some(x=>x.k===a.k)).map(a=>`<button class="ess" data-act="essence" data-arg="${a.k}">${t(a.s==='p'?'prefixes':'suffixes').slice(0,4)}. · ${afShort(a.k)}${S.hot===a.k?' 🔥':''}</button>`).join(''):''}</div><button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`},
 aff:()=>{const it=cur(),a=getSelAff(it);if(!a)return `<button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`;const d=AFM[a.k],rg=range(d,a.t),nx=a.t>1?range(d,a.t-1):null;
  const row=k=>{const r=why(k),cnt=k==='forge'?CONFIG.forgeGold+'🪙'+(a.t===2?' + 🔆×'+CONFIG.t1ForgeEmbers:''):'×'+S.cur[ACTS[k].cur];let info='';
   if(k==='forge'&&!r){const o=forgeOdds(it,a);info=`→ <span class="t${a.t-1}">T${a.t-1}</span> · ⚖${o.l}–${o.h} · <span class="good">✔${pct(o.ps)}</span> <span class="warn">💔${pct(o.pf)}</span> <span class="bad">💥${pct(o.ph)}</span>${S.omen==='omenF'?' · 🔮':''}`}else if(k!=='forge')info=CONFIG.stabCost[k]?'⚖ −'+CONFIG.stabCost[k]:'⚖ 0';
   return `<button class="arow ${r&&r!=='BUY'?'dim':''}" id="aa-${k}" data-act="act" data-arg="${k}" data-help="${k}"><span class="ai">${CICO[k]}</span><span class="grow"><b>${t('b_'+k)}</b> <span class="muted">${cnt}</span><br><span style="font-size:12px">${r&&r!=='BUY'?'<span class="warn">'+r+'</span>':info}</span></span></button>`};
  return `<h2><span class="t${a.t}">${pips(a.t)} T${a.t}</span> · ${afShort(a.k)} <span class="muted">(${t(d.s==='p'?'prefixes':'suffixes')})</span></h2><div class="af t${a.t}">${afText(a)}</div><div class="muted">${t('range')} T${a.t}: ${rg[0]}–${rg[1]}${nx?` · ${t('nextT')} T${a.t-1}: ${nx[0]}–${nx[1]}`:''}</div><div style="display:grid;gap:5px;margin:8px 0">${['forge','swap','tannul','lock'].map(row).join('')}</div><button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`},
 omen:()=>`<h2>🔮 ${t('b_omen')}</h2>${S.omen?`<div class="good">${t('omenActive')}: ${t(S.omen)}</div>`:''}${['omenP','omenS','omenF'].map(o=>`<div class="shopi flex"><div class="grow"><b>${t(o)}</b> · ×${S.cur[o]}<div class="muted">${t(o+'D')}</div></div><button class="gold" id="om-${o}" data-act="useOmen" data-arg="${o}" ${S.cur[o]&&S.omen!==o?'':'disabled'}>${t('activate')}</button><button id="ob-${o}" data-act="buyCur" data-arg="${o}:1">+${curCost(o)}🪙</button></div>`).join('')}<button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`
};
function render(){renderTop();$('#view').innerHTML=V[S.tab]();renderTabs();if(sheet&&SH[sheet]){$('#sheetBox').innerHTML=SH[sheet]();$('#sheet').classList.remove('hidden')}else $('#sheet').classList.add('hidden');updCd();applyGuide();paintAll()}

function updCd(){document.querySelectorAll('.cd').forEach(e=>{const u=e.dataset.u,until=u[0]==='b'?(S.bounties[+u.slice(1)]||{}).until:S[u];e.textContent=fmt((until||0)-S.play)})}
function tick(){if(document.hidden)return;S.play++;checkSkins();let rr=false;
 if(S.play>=S.marketAt){genMarket();rr=S.tab==='market'}
 if(S.play>=S.trendAt){rotateTrend();toast('🔥 '+t('hot')+': '+afShort(S.hot));rr=true}
 S.bounties.forEach((b,i)=>{if(S.play>=b.until){S.bounties[i]=genBounty();if(S.tab==='bounties')rr=true}});
 if(rr&&!document.querySelector('.slot')&&!sheet)render();else{renderTop();updCd()}if(S.play%5===0)save()}
function ensure(){if(!S.hot)rotateTrend();if(!S.market.length)genMarket();while(S.bounties.length<3)S.bounties.push(genBounty());S.quests=S.quests.filter(Boolean);while(S.quests.length<3)S.quests.push(genQuest());}
function init(){load();ensure();
 if(!S.tut){S.tut=true;modal(t('tutorial'))}
 const today=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
 if(S.login.last!==today){S.login.streak=S.login.last===y?S.login.streak+1:1;S.login.last=today;const g=CONFIG.daily.gold*Math.min(S.login.streak,7);S.gold+=g;S.cur.augment+=CONFIG.daily.aug;S.cur.reroll+=1;S.cur.embers+=CONFIG.daily.embers;
  modal(`<div class="lvl">🎁</div><div class="big">${t('daily')}</div><p style="text-align:center">${t('streak')}: <b>${S.login.streak}</b> 🔥<br>+${g}🪙 · +${CONFIG.daily.aug}💠 · +1🎲 · +${CONFIG.daily.embers}🔆</p>`)}
 render();save();setInterval(tick,1000)}
window.G={get S(){return S},set S(v){S=v},cxB,CXR,mpGain,presGoal,FR,ACT,render,itemValue,makeItem,save,why};
init();
</script>
</body></html>

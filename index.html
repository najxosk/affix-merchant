<title>Affix Merchant</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e0c0a;color:#d9c79a;font-family:Georgia,'Times New Roman',serif}
body{background:radial-gradient(circle at 50% 0,#2a231b,#0e0c0a 70%)}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:74px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#1d1813,#15110d);border-bottom:2px solid #4a3b28;padding:6px 8px;box-shadow:0 3px 10px #000a}
.row{display:flex;align-items:center;gap:6px}
#gold{font-size:20px;font-weight:bold;color:#ffd76a;flex:1}
#rep{font-size:13px;min-width:90px}
.bar{height:6px;background:#2b2219;border:1px solid #4a3b28;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b8862f,#ffd76a)}
button{font-family:inherit;color:#f0e2bb;background:linear-gradient(#4a3b28,#2c2318);border:1px solid #8a6d3e;border-radius:8px;padding:10px 12px;font-size:15px;min-height:44px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff22,0 2px 4px #0008}
button:active{transform:translateY(1px);filter:brightness(1.2)}
button:disabled{opacity:.4;filter:grayscale(1)}
button.sm{min-height:36px;padding:6px 9px;font-size:13px}
button.gold{background:linear-gradient(#a07a2c,#5e4518);border-color:#ffd76a;color:#fff6d8}
button.red{background:linear-gradient(#7a2c22,#421510);border-color:#d0584a}
#curs{display:flex;gap:8px;font-size:14px;margin-top:4px;flex-wrap:wrap}
#curs span{background:#0008;border:1px solid #3a2e20;border-radius:6px;padding:2px 6px}
#ticker{margin-top:5px;font-size:13px;background:#000a;border:1px solid #6b2d10;border-radius:6px;padding:4px 8px;color:#ffb36b;overflow:hidden;white-space:nowrap}
#ticker .hot{animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{color:#fff2a8;text-shadow:0 0 8px #ff7b00}}
main{flex:1;padding:8px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;background:#15110d;border-top:2px solid #4a3b28}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;border-radius:0;border:none;border-right:1px solid #3a2e20;background:none;min-height:64px;font-size:11px;padding:4px 2px;box-shadow:none}
nav button b{display:block;font-size:22px}
nav button.on{background:linear-gradient(#4a3b28,#221a12);color:#ffd76a}
h2{font-size:18px;margin:6px 0 8px;color:#e8c77a;border-bottom:1px solid #4a3b28;padding-bottom:4px}
.panel{background:linear-gradient(#211b15,#17130f);border:1px solid #4a3b28;border-radius:10px;padding:10px;margin-bottom:10px}
.card{position:relative;background:linear-gradient(#1b1612,#0f0c0a);border:2px solid var(--rc);border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 0 12px -2px var(--rc),inset 0 0 20px #000}
.card.r3{animation:glow 2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 24px 2px var(--rc),inset 0 0 20px #000}}
.ch{display:flex;gap:10px;align-items:center}
.ic{width:56px;height:56px;flex:none;border:1px solid #4a3b28;border-radius:8px;background:radial-gradient(#2e261d,#0d0b09)}
.ic svg{width:100%;height:100%}
.nm{font-size:17px;font-weight:bold;color:var(--rc)}
.sub{font-size:12px;opacity:.85}
.frac{color:#ff5a4a;font-weight:bold}
.affs{margin-top:8px}
.af{padding:7px 8px;margin:3px 0;border-radius:6px;background:#0006;border:1px solid transparent;font-size:14px}
.af.ia{cursor:pointer}
.af.sel{border-color:#ffd76a;background:#3a2e1a}
.af .tg{display:inline-block;min-width:44px;font-size:11px;opacity:.85}
.t1{color:#ff8c1a;text-shadow:0 0 6px #ff6a00}.t2{color:#c86bff}.t3{color:#4aa3ff}.t4{color:#5fd35f}.t5{color:#bbb}
.lbl{font-size:11px;opacity:.6;margin-top:6px;text-transform:uppercase;letter-spacing:1px}
.stab{font-size:12px;margin-top:6px}
.price{font-size:16px;color:#ffd76a;font-weight:bold}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cbtn{display:flex;gap:4px}.cbtn button:first-child{flex:1}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.strip button{width:58px;height:58px;padding:2px;flex:none;border:2px solid var(--rc)}
.strip button.on{box-shadow:0 0 10px var(--rc);background:#3a2e1a}
.strip svg{width:100%;height:100%}
.muted{opacity:.7;font-size:13px}
.odds{font-size:13px;line-height:1.5;margin:6px 0}
.good{color:#6be36b}.warn{color:#ffb84a}.bad{color:#ff5a4a}
.cx{display:grid;grid-template-columns:1.6fr repeat(5,1fr);gap:3px;font-size:12px;align-items:center}
.cx div.c{height:22px;border-radius:4px;background:#0008;border:1px solid #3a2e20;text-align:center;line-height:20px}
.cx div.c.on{background:currentColor}
.cx div.c.on span{color:#000}
.hidden{display:none!important}
#modal{position:fixed;inset:0;z-index:20;background:#000c;display:flex;align-items:center;justify-content:center;padding:14px}
#modal .box{max-width:500px;width:100%;max-height:88vh;overflow:auto;background:linear-gradient(#2a2219,#17130f);border:2px solid #8a6d3e;border-radius:12px;padding:14px;font-size:15px;line-height:1.45}
#toast{position:fixed;left:50%;bottom:80px;font-size:13px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:90%;max-width:420px}
#toast div{background:#000e;border:1px solid #b8862f;border-radius:8px;padding:8px 12px;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
#flash{position:fixed;inset:0;pointer-events:none;z-index:24;opacity:0;background:radial-gradient(#ffd76a,#ff6a0088 50%,transparent 80%)}
#flash.go{animation:flash 1s}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.reveal{animation:rev .7s}
@keyframes rev{0%{transform:rotateY(90deg) scale(.8);filter:brightness(3)}100%{transform:none}}
.big{font-size:22px;text-align:center;color:#ff8c1a;text-shadow:0 0 10px #ff6a00}
.stab,.fstab{position:relative}
.sbar i{transition:width .9s ease-out}
.float{position:absolute;right:6px;top:-6px;color:#ff6a4a;font-weight:bold;font-size:18px;text-shadow:0 0 6px #000,0 0 10px #ff3b2a;animation:flt 1.6s forwards;pointer-events:none;z-index:3}
@keyframes flt{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:translateY(-40px)}}
#shop{position:fixed;inset:0;z-index:19;background:#000c;display:flex;align-items:flex-end;justify-content:center}
#shop .box{max-width:560px;width:100%;max-height:92vh;overflow:auto;background:linear-gradient(#2a2219,#17130f);border:2px solid #8a6d3e;border-radius:14px 14px 0 0;padding:12px}
.shopi{border:1px solid #4a3b28;border-radius:10px;padding:8px;margin-bottom:8px;background:#0005}
.shopi button{min-height:50px;font-size:15px}
#curs{cursor:pointer}
.info{font-size:12px;background:#3a1510;border:1px solid #d0584a;border-radius:6px;padding:6px;margin-top:6px;color:#ffc9c0}
.pos{color:#6be36b}.neg{color:#ff6a5a}

 forge:()=>{const it=cur(),a=it&&getSelAff(it);if(!a||it.frac||it.unid)return;if(a.t===1)return toast(t('maxTier'));if(maxTier(it.ilvl)>a.t-1)return toast(t('ilvlLow'));if(S.gold<CONFIG.forgeGold)return toast(t('noGold'));
  S.gold-=CONFIG.forgeGold;S.stats.crafts++;const[l,h]=CONFIG.forgeCost(a.t),c=ri(l,h);
  if(c<=it.stab){const from=it.stab;it.stab-=c;a.t--;a.v=rollVal(AFM[a.k],a.t,a.q);discover(a);render();fxStab(it,c,from);anim('#wcard','shake');sparks($('#wcard'),['#ffb84a','#ff6a00'],45);SND.craft();toast('⚒️ −'+c+' '+t('stability'));if(a.t===1)jackpot();checkPerfect(it)}
  else if(R()<CONFIG.fractureShare){const from=it.stab;it.frac=true;it.stab=0;render();fxStab(it,from,from);anim('#wcard','shake');sparks($('#wcard'),'#ff3b2a',50);SND.fail();toast('<span class="bad">💔 '+t('fracturedT')+'</span>')}
  else{S.items.splice(S.sel,1);S.sel=S.items.length?0:-1;S.selAff=null;render();sparks(null,['#aaa','#ff3b2a','#555'],120);SND.shatter();toast('<span class="bad">💥 '+t('shatteredT')+'</span>')}
  save();return 'noR'},
 sell:()=>{const it=cur();if(!it||it.unid)return;const p=sellPrice(it),pr=p-it.cost;S.gold+=p;S.stats.sold++;S.stats.profit+=pr;finishItem();addXp(Math.max(2,Math.round(pr)));SND.coin();sparks($('#gold'),'#ffd76a',30);toast(`🪙 +${p} (${t('profitW')} ${pr>=0?'+':''}${pr})`)},
 deliver:i=>{const b=S.bounties[+i],it=cur(),m=bMatch(b,it);if(!m.m)return;S.gold+=m.pay;const pr=m.pay-it.cost;S.stats.sold++;S.stats.profit+=pr;finishItem();addXp(Math.max(5,Math.round(pr*(m.m===2?1.5:1))));S.bounties[+i]=genBounty();SND.coin();if(m.m===2)SND.jackpot();sparks($('#gold'),'#ffd76a',60);toast('📜 '+t('bountyDone')+' 🪙 +'+m.pay)},
 upgrade:k=>{const u=UPS.find(x=>x.k===k),l=S.up[k];if(l>=u.max||S.lvl<u.req(l))return;const c=u.cost(l);if(S.gold<c)return toast(t('noGold'));S.gold-=c;S.up[k]++;SND.lvl()},
 reset:()=>modal(`<p>${t('resetQ')}</p><p class="flex"><button class="red" data-act="resetYes">${t('yes')}</button><button data-act="closeModal">${t('no')}</button></p>`),

};

 document.querySelectorAll('.stab,.fstab').forEach(b=>{const f=document.createElement('div');f.className='float';f.textContent='−'+c+' ⚖ '+t('stability');b.appendChild(f);setTimeout(()=>f.remove(),1700)})}

function renderTop(){$('#gold').innerHTML='🪙 '+S.gold;$('#rep').innerHTML=`⭐ ${t('level')} ${S.lvl}<div class="bar"><i style="width:${S.xp/needXp(S.lvl)*100}%"></i></div>`;$('#langBtn').textContent='🌐 '+t('lang');

const V={
 market:()=>{const sel=cur(),cheap=Math.min(...S.market.map(buyPrice),999);return `${S.gold<cheap&&!S.items.length?`<div class="panel" style="border-color:#6be36b"><b>🤝 ${t('charityT')}</b><div class="muted">${t('charityD')}</div><button class="gold" style="width:100%;margin-top:6px" id="charity" data-act="charity" ${S.play<S.helpAt?'disabled':''}>${S.play<S.helpAt?t('charityWait')+' '+fmt(S.helpAt-S.play):'🎁 '+t('charityBtn')}</button></div>`:''}
 <button class="gold" style="width:100%;margin-bottom:10px" data-act="shop" id="openShop">🛒 ${t('shopT')}</button><div class="panel flex"><div class="grow muted">${t('newStock')} <span class="cd" data-u="marketAt"></span></div><button class="sm" id="refreshBtn" data-act="refresh">🔄 ${t('refresh')} (${S.market.length?CONFIG.marketRefreshCost+'🪙':'0🪙'})</button></div>
 <div class="panel flex" style="border-color:#ffff7766"><div style="font-size:34px">🎁</div><div class="grow"><b>${t('crate')}</b><div class="muted">${S.lvl>=2?t('crateD'):t('needLvl')+' 2'}</div></div><button class="gold" data-act="crate" ${S.lvl<2?'disabled':''}>${CONFIG.crateCost}🪙</button></div>
 ${S.market.map((it,i)=>{const d=sel&&!sel.unid?itemValue(it)-itemValue(sel):null;return itemCard(it,false,`<div class="flex" style="margin-top:8px"><div class="grow muted">${t('value')} ~${itemValue(it)}🪙${d!==null?`<br><span class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${d}</span> ${t('compare')}`:''}</div><button class="gold buy" data-act="buy" data-arg="${i}">${t('buy')} ${buyPrice(it)}🪙</button></div>`)}).join('')}`},
 workshop:()=>{const it=cur();const strip=`<div class="strip">${S.items.map((x,i)=>`<button class="${i===S.sel?'on':''}" style="--rc:${RAR[rarity(x)][1]}" data-act="selItem" data-arg="${i}">${x.unid?'<span style="font-size:28px">❓</span>':icon(x.base)}</button>`).join('')}</div>`;
  if(!it)return strip+`<div class="panel">${t('noItem')}</div><div class="flex"><button class="gold grow" data-act="tab" data-arg="market">🏪 ${t('market')}</button><button class="gold grow" data-act="shop">🛒 ${t('shop')}</button></div>`;
  if(it.unid)return strip+itemCard(it,true)+`<button class="gold" style="width:100%" data-act="identify">🔍 ${t('identify')}</button>`;
  const dis=it.frac?'disabled':'',sa=getSelAff(it);
  let forge=`<div class="muted">${all(it).length?t('selectAff'):t('addFirst')}</div>`;

  else if(sa){if(sa.t===1)forge=`<div class="t1">${t('maxTier')}</div>`;else if(maxTier(it.ilvl)>sa.t-1)forge=`<div class="warn">${t('ilvlExpl').replace('{i}',it.ilvl).replace('{m}',maxTier(it.ilvl)).replace('{n}',sa.t-1).replace('{r}',CONFIG.tierIlvl[sa.t-1])}</div>`;else{const{l,h,ps,pf,ph}=forgeOdds(it,sa);
   forge=`<div class="odds"><span class="t${sa.t}">${afShort(sa.k)} T${sa.t}</span> → <span class="t${sa.t-1}">T${sa.t-1}</span><br>${t('forgeCost')}: <b>${l}–${h}</b> (${t('stability')} ${it.stab})<br><span class="good">✔ ${t('safe')} ${Math.round(ps*100)}%</span> · <span class="warn">💔 ${t('fracture')} ${Math.round(pf*100)}%</span> · <span class="bad">💥 ${t('shatter')} ${Math.round(ph*100)}%</span></div><button class="${ps<1?'red':'gold'}" id="forgeBtn" style="width:100%" data-act="forgeAsk" ${dis}>${ps<1?'⚠️ ':''}🔥 ${t('forgeBtn')} (${CONFIG.forgeGold}🪙)</button>`}}
  return strip+itemCard(it,true)+`<div class="panel"><div class="grid2">${CURS.map(c=>{const lk=c==='lock'&&S.lvl<3;return `<div><div class="cbtn"><button id="use-${c}" data-act="use" data-arg="${c}" ${dis||lk||(c==='lock'&&!sa)?'disabled':''} title="${t(c+'D')}">${CICO[c]} ×${S.cur[c]}</button><button id="buy-${c}" data-act="buyCur" data-arg="${c}:1" ${lk||S.gold<curCost(c)?'disabled':''}>+1 · ${curCost(c)}🪙</button></div><div class="muted" style="font-size:11px">${lk?'🔒 '+t('unlockAt')+' 3':t(c)+': '+t(c+'D')}</div></div>`}).join('')}</div></div>
  <div class="panel"><h2>🧪 ${t('essence')}</h2><div class="muted">${t('essenceD')}</div><button style="width:100%;margin-top:6px" id="essToggle" data-act="essOpen" ${dis}>${essOpen?'▲':'▼'} ${CONFIG.essenceCost}🪙</button>
  ${essOpen&&!it.frac?`<div class="grid2" style="margin-top:6px">${AFF.filter(a=>it[a.s].length<3&&!all(it).some(x=>x.k===a.k)).map(a=>`<button class="sm ess" data-act="essence" data-arg="${a.k}" ${S.gold<CONFIG.essenceCost?'disabled':''}>${a.s==='p'?'P':'S'} ${afShort(a.k)}${S.hot===a.k?' 🔥':''}</button>`).join('')||`<div class="muted">${t('full')}</div>`}</div>${S.gold<CONFIG.essenceCost?`<div class="warn">${t('needGold')} ${CONFIG.essenceCost-S.gold}🪙</div>`:''}`:''}</div>
  <div class="panel"><h2>🔥 ${t('forge')}</h2><div class="fstab">⚖ ${t('stability')}: <b class="stabv">${it.stab}</b>${sbar(it,it.stab)}</div>${forge}</div>
  ${(()=>{const sp=sellPrice(it),pr=sp-it.cost;return `<button class="gold" id="sellBtn" style="width:100%;font-size:18px" data-act="sell">🪙 ${t('sell')} ${sp} <span class="${pr>=0?'pos':'neg'}">(${pr>=0?t('profitW')+' +'+pr:t('loss')+' '+pr})</span><div class="muted" style="font-size:12px">${t('paid')} ${it.cost}🪙</div></button>

 bounties:()=>{const it=cur();return `<div class="panel muted">${t('selItem')}: ${it?(it.unid?t('unid'):(rarity(it)>=2?it.name:t(it.base))+' · ilvl '+it.ilvl):'—'}</div>`+S.bounties.map((b,i)=>{const m=bMatch(b,it);

 codex:()=>{const n=Object.keys(S.codex).length;return `<div class="panel"><h2>📖 ${t('codexT')} ${n}/${AFF.length*5}</h2><div class="cx"><div></div>${[5,4,3,2,1].map(x=>`<div class="t${x}" style="text-align:center">T${x}</div>`).join('')}
  ${AFF.map(a=>`<div>${a.s==='p'?'P':'S'} ${afShort(a.k)}${rowDone(a.k)?' ✨':''}</div>`+[5,4,3,2,1].map(x=>`<div class="c t${x} ${S.codex[a.k+x]?'on':''}"><span>${S.codex[a.k+x]?'✓':''}</span></div>`).join('')).join('')}</div></div>
  <div class="panel"><h2>${t('bonuses')}</h2><div>${codexRows()?'✅':'⬜'} ${t('rowB')} (${codexRows()})</div><div>${pageDone('p')?'✅':'⬜'} ${t('pageP')}</div><div>${pageDone('s')?'✅':'⬜'} ${t('pageS')}</div></div>
  <div class="panel"><h2>👑 ${t('hof')}</h2>${S.hof.length?S.hof.map(h=>`<div class="t1">${h.name} · ${t(h.base)} · ilvl ${h.ilvl} · ${h.at}</div>`).join(''):`<div class="muted">${t('hofE')}</div>`}</div>
  <div class="panel"><h2>${t('stats')}</h2>${t('sold')}: ${S.stats.sold} · ${t('profit')}: ${S.stats.profit}🪙 · ${t('crafts')}: ${S.stats.crafts} · ${t('t1s')}: ${S.stats.t1} · ${t('streak')}: ${S.login.streak}</div>`},
 upgrades:()=>`<div class="panel"><h2>⭐ ${t('rep')} – ${t('level')} ${S.lvl}</h2><div class="bar"><i style="width:${S.xp/needXp(S.lvl)*100}%"></i></div><div class="muted">${S.xp}/${needXp(S.lvl)} XP</div>
  <div class="lbl">${t('unlocks')}</div>${[1,2,3,4].map(l=>`<div>${S.lvl>=l?'✅':'🔒'} ${t('level')} ${l}: ${t('u'+l)}</div>`).join('')}<div class="muted">${t('uI')} (${marketMax()})</div></div>
  ${UPS.map(u=>{const l=S.up[u.k],mx=l>=u.max,rq=u.req(l);return `<div class="panel flex"><div class="grow"><b>${t('up_'+u.k)}</b> (${l}/${u.max})<div class="muted">${t('up_'+u.k+'D')}${!mx&&S.lvl<rq?' · '+t('needLvl')+' '+rq:''}</div></div><button class="gold" data-act="upgrade" data-arg="${u.k}" ${mx||S.lvl<rq?'disabled':''}>${mx?t('maxed'):u.cost(l)+'🪙'}</button></div>`}).join('')}
  <button class="red sm" data-act="reset">🗑 ${t('reset')}</button>`
};
function render(){renderTop();$('#view').innerHTML=V[S.tab]();renderTabs();if(shopOpen){$('#shopBox').innerHTML=shopHtml();$('#shop').classList.remove('hidden')}else $('#shop').classList.add('hidden');updCd()}
function updCd(){document.querySelectorAll('.cd').forEach(e=>{const u=e.dataset.u,until=u[0]==='b'&&u!=='b'?(S.bounties[+u.slice(1)]||{}).until:S[u];e.textContent=fmt((until||0)-S.play)})}
// ================= LOOP =================
function tick(){if(document.hidden)return;S.play++;let rr=false;
 if(S.play>=S.marketAt){genMarket();rr=S.tab==='market'}
 if(S.play>=S.trendAt){rotateTrend();toast('🔥 '+t('hot')+': '+afShort(S.hot));rr=true}
 S.bounties.forEach((b,i)=>{if(S.play>=b.until){S.bounties[i]=genBounty();if(S.tab==='bounties')rr=true}});
 if(rr)render();else{updCd()}if(S.play%5===0)save()}
// ================= INIT =================
function init(){const had=load();if(!S.hot)rotateTrend();if(!S.market.length)genMarket();while(S.bounties.length<3)S.bounties.push(genBounty());
 if(!S.tut){S.tut=true;modal(t('tutorial'))}
 const today=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
 if(S.login.last!==today){S.login.streak=S.login.last===y?S.login.streak+1:1;S.login.last=today;const g=CONFIG.daily.gold*Math.min(S.login.streak,7);S.gold+=g;S.cur.augment+=CONFIG.daily.aug;S.cur.reroll+=1;
  modal(`<div class="big">🎁 ${t('daily')}</div><p style="text-align:center">${t('streak')}: <b>${S.login.streak}</b> 🔥<br>+${g}🪙 · +${CONFIG.daily.aug}💠 · +1🎲</p>`)}
 render();save();setInterval(tick,1000)}
window.G={get S(){return S},ACT,render,itemValue,genMarket,makeItem,save};
init();

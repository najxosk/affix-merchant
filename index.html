 return{id:S.nid++,face:pick(FACES),name:pick(CUSTN),keys,minIlvl:Math.max(1,Math.round(ri(1,marketMax()*.6)/5)*5),minStab:R()<.35?ri(1,4)*5:0,until:S.play+CONFIG.bountyRefreshSec+ri(0,60),bonus:ri(5,30)}}
function bMatch(b,it){if(!it||it.unid)return{m:0,hit:0};const ks=all(it).map(a=>a.k),hit=b.keys.filter(k=>ks.includes(k)).length,v=itemValue(it);
 if(hit===b.keys.length&&it.ilvl>=b.minIlvl&&it.stab>=b.minStab)return{m:2,hit,pay:Math.round(v*CONFIG.bountyExact+20+b.bonus)};if(hit>0)return{m:1,hit,pay:Math.round(v*CONFIG.bountyPartial)};return{m:0,hit}}
function genQuest(){const ex=S.quests.filter(Boolean).map(q=>q.k);let k;do k=pick(QPOOL);while(ex.includes(k));const L=S.lvl;
 const n={sell:Math.round((50+L*50)/10)*10,t1:1,forge:2+L,bounty:1,salvage:2,rare:4,crafts:8+L*2,profit:80+L*60}[k];return{k,n,p:0,g:25+L*15,c:pick(['augment','reroll','swap','tannul','sroll']),cn:2,e:k==='forge'||k==='t1'?1:0}}

 if(!rb&&rowDone(a.k))toast('✨ '+t('rowB'));if(!pp&&pageDone('p'))toast('✨ '+t('pageP'));if(!ps&&pageDone('s'))toast('✨ '+t('pageS'))}

function why(a){if(a==='shop')return'';const it=cur();if(!it)return t('noItem');if(it.unid)return t('needId');if(it.frac)return t('fracShort');
 const A=all(it),sa=getSelAff(it),d=ACTS[a];
 if(a==='ember'){if(S.cur.embers<1)return t('noEmbers');if(it.stab>=it.stab0)return t('stabFull');return''}
 if(it.stab<=0)return t('sealedShort');
 if(a==='lock'&&S.lvl<CONFIG.lockLvl)return t('unlockAt')+' '+CONFIG.lockLvl;
 if(d.sel&&!sa)return t('pickAff');
 const sc=CONFIG.stabCost[a]||0;if(sc&&it.stab<sc)return t('lowStab')+' (⚖'+sc+')';
 if(d.cur&&S.cur[d.cur]<1)return'BUY';
 const free=x=>!x.lock;
 if((a==='augment'||a==='essence')&&A.length>=6)return t('full');
 if((a==='reroll'||a==='annul')&&!A.some(free))return t('nothing');
 if(a==='preroll'&&!it.p.some(free))return t('nothing');
 if(a==='sroll'&&!it.s.some(free))return t('nothing');
 if((a==='tannul'||a==='swap'||a==='lock')&&sa.lock)return t('isLocked');
 if(a==='swap'&&!AFF.some(x=>x.s===AFM[sa.k].s&&!A.some(y=>y.k===x.k)))return t('nothing');
 if(a==='essence'&&S.gold<CONFIG.essenceCost)return t('needGold')+' '+(CONFIG.essenceCost-S.gold)+'🪙';
 if(a==='forge'){if(sa.t===1)return t('maxTier');if(maxTier(it.ilvl)>sa.t-1)return ilvlTxt(it,sa);if(sa.t===2&&S.cur.embers<CONFIG.t1ForgeEmbers)return t('needEmbers')+'×'+CONFIG.t1ForgeEmbers;if(S.gold<CONFIG.forgeGold)return t('noGold')}
 return''}

function doCraft(a){const it=cur(),A=all(it),sa=getSelAff(it),sc=CONFIG.stabCost[a]||0,d=ACTS[a],from=it.stab;let slot=[],jack=false;
 switch(a){
  case'augment':{const x=addAffix(it);discover(x);jack=x.t===1;slot=[idOf(it,x)];break}
  case'reroll':case'preroll':case'sroll':{const f=A.filter(x=>!x.lock&&(a==='reroll'||(a==='preroll'?it.p.includes(x):it.s.includes(x))));f.forEach(x=>{x.q=R();x.v=rollVal(AFM[x.k],x.t,x.q)});slot=f.map(x=>idOf(it,x));A.forEach(x=>x.lock=false);break}
  case'annul':{const x=pick(A.filter(x=>!x.lock));it.p=it.p.filter(y=>y!==x);it.s=it.s.filter(y=>y!==x);A.forEach(x=>x.lock=false);S.selAff=null;break}
  case'tannul':it.p=it.p.filter(y=>y!==sa);it.s=it.s.filter(y=>y!==sa);S.selAff=null;break;
  case'swap':{const side=AFM[sa.k].s,dd=pick(AFF.filter(x=>x.s===side&&!A.some(y=>y.k===x.k))),tr=rollTier(it.ilvl),q=R();Object.assign(sa,{k:dd.k,t:tr,q,v:rollVal(dd,tr,q)});discover(sa);jack=tr===1;slot=[S.selAff];break}

 }
 if(d.cur)S.cur[d.cur]--;it.stab=Math.max(0,it.stab-sc);S.stats.crafts++;qp('crafts',1);qp('rare',all(it).length,1);
 render();const card=$('#wcard');anim(card,'shake');sparks(card,a==='annul'||a==='tannul'?'#9be':a==='ember'?'#ffb84a':'#ffd76a',25);SND.craft();
 slotAnim(slot);if(it.stab!==from)fxStab(it,from);if(jack)setTimeout(jackpot,650);if(it.stab<=0&&from>0)toast('🔒 '+t('sealedShort'));checkPerfect(it);save()}
function slotAnim(ids){const els=ids.filter(Boolean).map(id=>document.querySelector(`#wcard .af[data-arg="${id}"]`)).filter(Boolean);if(!els.length)return;
 els.forEach(e=>{e.classList.add('slot');e._fin=e.querySelector('.v').textContent});let n=0;const iv=setInterval(()=>{n++;els.forEach(e=>{const v=e.querySelector('.v');if(v)v.textContent=Math.max(1,Math.round(+e._fin*(0.3+R()*1.4)))});SND.tick();

const V={

  ${broke?`<button class="gold" id="charity" data-act="charity" ${S.play<S.helpAt?'disabled':''}>${t('charityT')} ${S.play<S.helpAt?t('charityWait')+' '+fmt(S.helpAt-S.play):t('charityBtn')}</button>`:''}
  <div class="list">${S.market.map((it,i)=>{const d=sel&&!sel.unid?itemValue(it)-itemValue(sel):null;

 workshop:()=>{const it=cur();const strip=`<div class="strip"><button data-act="sheet" data-arg="stash" id="stashBtn2">📦</button>${S.items.map((x,i)=>`<button class="${i===S.sel?'on':''}" style="--rc:${RAR[rarity(x)][1]}" data-act="selItem" data-arg="${i}">${x.unid?'<span style="font-size:22px">❓</span>':icon(x.base)}</button>`).join('')}</div>`;
  if(!it)return `<div class="ws">${strip}<div class="panel">${t('noItem')}</div><div class="flex"><button class="gold grow" data-act="tab" data-arg="market">🏪 ${t('market')}</button><button class="gold grow" data-act="sheet" data-arg="shop">🛒 ${t('s_shop')}</button></div></div>`;
  if(it.unid)return `<div class="ws">${strip}${itemCard(it,true)}<button class="gold" style="min-height:56px" id="identifyBtn" data-act="identify">🔍 ${t('identify')}</button></div>`;
  const sp=sellPrice(it),pr=sp-it.cost;

  <div class="sellrow"><button class="${isJunk(it)?'':'gold'}" id="sellBtn" data-act="sell">🪙 ${t('sell')} ${sp} <span style="font-size:12px" class="${pr>=0?'pos':'neg'}">${pr>=0?'+'+pr:pr}</span><br><span class="muted" style="font-size:11px">${pr>=0?t('profitW'):t('loss')} · ${t('paid')} ${it.cost}</span></button>
  <button id="salvageBtn" data-act="salvage" ${isJunk(it)?'class="gold"':''}>♻ ${t('salvage')}<br><span style="font-size:12px">+${salvageN(it)} 🔆</span></button></div></div>`},
 bounties:()=>{const it=cur();return `<div class="panel"><h2>🎯 ${t('quests')}</h2>${S.quests.map((q,i)=>`<div class="q"><div class="grow">${t('q'+q.k).replace('{n}',q.n)}<div class="bar"><i style="width:${q.p/q.n*100}%"></i></div></div><span class="muted">+${q.g}🪙 ${q.cn}${CICO[q.c]}${q.e?' 🔆':''}</span><button class="sm ${q.p>=q.n?'gold':''}" id="cl-${i}" data-act="claim" data-arg="${i}" ${q.p>=q.n?'':'disabled'}>${q.p>=q.n?t('claim'):q.p+'/'+q.n}</button></div>`).join('')}</div>
  <div class="muted" style="margin:0 0 6px">${t('selItem')}: ${it?(it.unid?t('unid'):(rarity(it)>=2?it.name:t(it.base))+' · ilvl '+it.ilvl+' · ⚖'+it.stab):'—'}</div>`+S.bounties.map((b,i)=>{const m=bMatch(b,it);
  const miss=it&&!it.unid&&m.m<2?[...b.keys.filter(k=>!all(it).some(a=>a.k===k)).map(afShort),...(it.ilvl<b.minIlvl?['ilvl '+b.minIlvl]:[]),...(it.stab<b.minStab?['⚖'+b.minStab]:[])]:[];
  return `<div class="panel"><div class="flex"><div style="font-size:30px">${b.face}</div><div class="grow"><b>${b.name}</b> <span class="muted">· ${t('leaves')} <span class="cd" data-u="b${i}"></span></span><div style="font-size:13px">${t('wants')}: ${b.keys.map(k=>`<b class="t3">${afShort(k)}</b>`).join(' + ')} · ${t('minIlvl')} ${b.minIlvl}+${b.minStab?` · ⚖${b.minStab}+`:''}</div></div></div>
  <div class="flex" style="margin-top:4px"><div class="grow ${m.m===2?'good':m.m===1?'warn':'muted'}" style="font-size:12px">${m.m===2?'✔ '+t('exact'):m.m===1?'≈ '+t('partial')+` (${m.hit}/${b.keys.length})`:t('nomatch')}${miss.length?`<br><span class="muted">${t('missing')}: ${miss.join(', ')}</span>`:''}</div><button class="sm" data-act="skipB" data-arg="${i}">↻ ${CONFIG.bountySkipCost}🪙</button><button class="gold deliver" id="dl-${i}" data-act="deliver" data-arg="${i}" ${m.m?'':'disabled'}>${t('deliver')}${m.m?' '+m.pay+'🪙':''}</button></div></div>`}).join('')},
 codex:()=>{const n=Object.keys(S.codex).length;return `<div class="panel"><h2>📖 ${t('codexT')} ${n}/${AFF.length*5}</h2><div class="cx"><div></div>${[5,4,3,2,1].map(x=>`<div class="t${x}" style="text-align:center">T${x}</div>`).join('')}
  ${AFF.map(a=>`<div>${a.s.toUpperCase()} ${afShort(a.k)}${rowDone(a.k)?' ✨':''}</div>`+[5,4,3,2,1].map(x=>`<div class="c t${x} ${S.codex[a.k+x]?'on':''}"><span>${S.codex[a.k+x]?'✓':''}</span></div>`).join('')).join('')}</div></div>
  <div class="panel"><h2>${t('bonuses')}</h2><div>${codexRows()?'✅':'⬜'} ${t('rowB')} (${codexRows()})</div><div>${pageDone('p')?'✅':'⬜'} ${t('pageP')}</div><div>${pageDone('s')?'✅':'⬜'} ${t('pageS')}</div></div>
  <div class="panel"><h2>👑 ${t('hof')}</h2>${S.hof.length?S.hof.map(h=>`<div class="t1">${h.name} · ${t(h.base)} · ilvl ${h.ilvl} · ${h.at}</div>`).join(''):`<div class="muted">${t('hofE')}</div>`}</div>
  <div class="panel"><h2>${t('stats')}</h2>${t('sold')}: ${S.stats.sold} · ${t('profit')}: ${S.stats.profit}🪙 · ${t('crafts')}: ${S.stats.crafts} · ${t('t1s')}: ${S.stats.t1} · ${t('streak')}: ${S.login.streak}</div>`},
 upgrades:()=>`<div class="panel"><h2>⭐ ${t('rep')} – ${t('level')} ${S.lvl}</h2><div class="bar"><i style="width:${S.xp/needXp(S.lvl)*100}%"></i></div><div class="muted">${S.xp}/${needXp(S.lvl)} XP</div>
  ${[1,2,3,4].map(l=>`<div>${S.lvl>=l?'✅':'🔒'} ${t('level')} ${l}: ${t('u'+l)}</div>`).join('')}<div class="muted">${t('uI')} (${marketMax()})</div></div>
  ${UPS.map(u=>{const l=S.up[u.k],mx=l>=u.max,rq=u.req(l);return `<div class="panel flex"><div class="grow"><b>${t('up_'+u.k)}</b> (${l}/${u.max})<div class="muted">${t('up_'+u.k+'D')}${!mx&&S.lvl<rq?' · '+t('needLvl')+' '+rq:''}</div></div><button class="gold" data-act="upgrade" data-arg="${u.k}" ${mx||S.lvl<rq?'disabled':''}>${mx?t('maxed'):u.cost(l)+'🪙'}</button></div>`}).join('')}
  <button class="red sm" data-act="reset">🗑 ${t('reset')}</button>`
};
const SH={
 shop:()=>`<div class="flex"><h2 class="grow">🛒 ${t('shopT')}</h2><span>🪙 ${S.gold} · 🔆 ${S.cur.embers}</span></div>`+CURS.map(c=>{const lk=c==='lock'&&S.lvl<CONFIG.lockLvl,p=curCost(c),e=c==='lock'?CONFIG.lockEmbers:0;
  const w=lk?`🔒 ${t('unlockAt')} ${CONFIG.lockLvl}`:S.gold<p?`${t('needGold')} ${p-S.gold}🪙`:S.cur.embers<e?t('noEmbers'):'';
  return `<div class="shopi"><div class="flex"><div style="font-size:24px">${CICO[c]}${CTAG[c]?`<sub style="font-size:11px">${CTAG[c]}</sub>`:''}</div><div class="grow"><b>${t(c)}</b> · ${t('owned')}: <b id="own-${c}">${S.cur[c]}</b>${CONFIG.stabCost[c]?` · <span style="color:#7fd0ff">⚖${CONFIG.stabCost[c]}</span>`:''}<div class="muted">${t(c+'D')}</div></div>
  <button class="gold" id="shop-${c}-1" data-act="buyCur" data-arg="${c}:1" ${w?'disabled':''}>×1<br>${p}🪙${e?'+'+e+'🔆':''}</button><button class="gold" id="shop-${c}-5" data-act="buyCur" data-arg="${c}:5" ${w||S.gold<p*5||S.cur.embers<e*5?'disabled':''}>×5<br>${p*5}🪙</button></div>${w?`<div class="warn" style="font-size:12px">${w}</div>`:''}</div>`}).join('')+
  `<div class="shopi"><div class="flex"><div style="font-size:24px">🔆</div><div class="grow"><b>${t('embers')}</b> · ${t('owned')}: <b>${S.cur.embers}</b><div class="muted">${t('embersD')}</div><div class="warn" style="font-size:12px">${t('srcE')}</div></div></div></div><div class="muted" style="margin:4px 0 8px">${t('src')}</div><button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`,
 stash:()=>`<h2>📦 ${t('stash')} ${S.items.length}/${stallSize()}</h2>${S.items.length?S.items.map((x,i)=>`<div class="si" style="--rc:${RAR[rarity(x)][1]}"><div class="ic">${x.unid?'':icon(x.base)}</div><div class="grow" data-act="selItem" data-arg="${i}"><b style="color:var(--rc)">${x.unid?t('crate'):rarity(x)>=2?x.name:t(x.base)}</b>${x.frac?' <span class="tagx">💔</span>':''}<div class="muted">ilvl ${x.ilvl} · ${x.unid?'?':all(x).length+'× afix · ⚖'+x.stab+'/'+x.stab0}</div></div>
  <button class="sm" data-act="selItem" data-arg="${i}">⚒️</button>${x.unid?'':`<button class="sm ${isJunk(x)?'':'gold'}" id="sl-${i}" data-act="sell" data-arg="${i}">${sellPrice(x)}🪙</button><button class="sm ${isJunk(x)?'gold':''}" id="sv-${i}" data-act="salvage" data-arg="${i}">♻${salvageN(x)}🔆</button>`}</div>`).join(''):`<div class="muted">${t('noItem')}</div>`}<button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`,
 essence:()=>{const it=cur();return `<h2>${t('essenceT')}</h2><div class="muted">${t('essenceD2')} · ${CONFIG.essenceCost}🪙 · ⚖${CONFIG.stabCost.essence}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0">${it?AFF.filter(a=>it[a.s].length<3&&!all(it).some(x=>x.k===a.k)).map(a=>`<button class="ess" data-act="essence" data-arg="${a.k}">${a.s.toUpperCase()} · ${afShort(a.k)}${S.hot===a.k?' 🔥':''}</button>`).join(''):''}</div><button style="width:100%" id="closeSheet" data-act="closeSheet">✖ ${t('close')}</button>`}
};
function render(){renderTop();$('#view').innerHTML=V[S.tab]();renderTabs();if(sheet&&SH[sheet]){$('#sheetBox').innerHTML=SH[sheet]();$('#sheet').classList.remove('hidden')}else $('#sheet').classList.add('hidden');updCd()}
function updCd(){document.querySelectorAll('.cd').forEach(e=>{const u=e.dataset.u,until=u[0]==='b'?(S.bounties[+u.slice(1)]||{}).until:S[u];e.textContent=fmt((until||0)-S.play)})}
function tick(){if(document.hidden)return;S.play++;let rr=false;
 if(S.play>=S.marketAt){genMarket();rr=S.tab==='market'}
 if(S.play>=S.trendAt){rotateTrend();toast('🔥 '+t('hot')+': '+afShort(S.hot));rr=true}
 S.bounties.forEach((b,i)=>{if(S.play>=b.until){S.bounties[i]=genBounty();if(S.tab==='bounties')rr=true}});
 if(rr&&!document.querySelector('.slot')&&!sheet)render();else{renderTop();updCd()}if(S.play%5===0)save()}
function init(){load();if(!S.hot)rotateTrend();if(!S.market.length)genMarket();while(S.bounties.length<3)S.bounties.push(genBounty());S.quests=S.quests.filter(Boolean);while(S.quests.length<3)S.quests.push(genQuest());
 if(!S.tut){S.tut=true;modal(t('tutorial'))}
 const today=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
 if(S.login.last!==today){S.login.streak=S.login.last===y?S.login.streak+1:1;S.login.last=today;const g=CONFIG.daily.gold*Math.min(S.login.streak,7);S.gold+=g;S.cur.augment+=CONFIG.daily.aug;S.cur.reroll+=1;S.cur.embers+=CONFIG.daily.embers;
  modal(`<div class="lvl">🎁</div><div class="big">${t('daily')}</div><p style="text-align:center">${t('streak')}: <b>${S.login.streak}</b> 🔥<br>+${g}🪙 · +${CONFIG.daily.aug}💠 · +1🎲 · +${CONFIG.daily.embers}🔆</p>`)}
 render();save();setInterval(tick,1000)}
window.G={get S(){return S},ACT,render,itemValue,makeItem,save,why};
init();
